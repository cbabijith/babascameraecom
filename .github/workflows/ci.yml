name: Commerce quality gates

on:
  push:
    branches:
      - development
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: commerce-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_STOREFRONT_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_WEB_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_ADMIN_URL: http://127.0.0.1:3001
  PRODUCT_IMAGES_BUCKET: product-images

jobs:
  quality:
    name: Static checks, unit tests, and builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Verify generated Drizzle state
        run: |
          bun run db:generate
          bun run db:check
          git diff --exit-code -- packages/db/drizzle

      - name: Type-check workspaces
        run: bun run type-check

      - name: Lint workspaces
        run: bun run lint

      - name: Run unit and offline migration tests
        run: bun run test

      - name: Build storefront and admin
        run: bun run build

  database:
    name: Apply Drizzle migration to PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: babas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/babas_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Apply the sole Drizzle migration authority
        run: |
          bun run --cwd packages/db db:compat
          bun run db:migrate
          bun run db:migrate
          bun run db:validate

  browser:
    name: Storefront and admin browser smoke tests
    runs-on: ubuntu-latest
    needs:
      - quality
      - database
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: babas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/babas_ci
      E2E_SEED_AUTH: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Apply Drizzle migration
        run: |
          bun run --cwd packages/db db:compat
          bun run db:migrate

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: bun run test:e2e:chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7
